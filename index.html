<!DOCTYPE html>
<html>
<head>
  <title>Box Slider Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap');
    
    body {
      font-family: 'Jost', sans-serif; /* Jost is similar to Futura Light */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }
    
    .container {
      width: 800px;
      height: 500px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      background-color: white;
    }
    
    .box-container {
      width: 2400px; /* 3x width of container */
      height: 100%;
      display: flex;
      transition: transform 0.5s ease;
    }
    
    .box {
      width: 800px;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    
    .title {
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 20px;
      text-align: center;
      color: #009fe3;
    }
    
    .subtitle-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #009fe3;
      flex: 1;
      margin: 0 10px;
    }
    
    .model-container {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Special styling for the first box */
    .box:first-child {
      position: relative;
      overflow: hidden;
    }
    
    .box:first-child .title,
    .box:first-child .subtitle-container {
      position: relative;
      z-index: 10;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    
    .box:first-child .model-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
    }
    
    .box:first-child::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.2));
      pointer-events: none;
      z-index: 5;
    }
    
    .box:first-child .model-container model-viewer {
      --scale: 1.5;
      transform: scale(var(--scale));
    }
    
    /* For second and third boxes, keep original styling */
    .box:not(:first-child) .model-container {
      width: 500px;
      height: 350px;
      border-radius: 8px;
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: #009fe3;
      --progress-mask: transparent;
      pointer-events: none; /* Allow clicks to pass through to trigger slide navigation */
    }
    
    .navigation {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .nav-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ddd;
      margin: 0 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    
    .nav-dot.active {
      background-color: #009fe3;
      transform: scale(1.2);
    }
  </style>
  <!-- Import the model-viewer component -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <!-- Preconnect to fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="container">
    <div class="box-container">
      <!-- Box 1 -->
      <div class="box">
        <div class="model-container">
          <model-viewer
            src="model.glb"
            camera-controls
            auto-rotate
            rotation-per-second="5deg"
            auto-play
            animation-name="idle"
            animation-crossfade-duration="0.5"
            shadow-intensity="1"
            environment-image="neutral"
            background-color="transparent"
            interaction-prompt="none"
            camera-orbit="0deg 90deg 105%"
            min-camera-orbit="auto auto 50%"
            max-camera-orbit="auto auto 400%"
            field-of-view="8deg">
          </model-viewer>
        </div>
        <div class="title">Robotics and Digital Systems</div>
        <div class="subtitle-container">
          <div class="subtitle">•STRATA Robotic Assembly Projects</div>
          <div class="subtitle">•Sanad MRO Robotics Projects</div>
        </div>
      </div>
      
      <!-- Box 2 -->
      <div class="box">
        <div class="title">Advanced Materials</div>
        <div class="subtitle-container">
          <div class="subtitle">•HP Compressor Blade Repair via SLM</div>
          <div class="subtitle">•Barrier Property Enhancement of Hydrogen Tanks</div>
        </div>
        <div class="model-container">
          <model-viewer
            src="model2.glb"
            camera-controls
            auto-rotate
            rotation-per-second="30deg"
            auto-play
            animation-name="idle"
            animation-crossfade-duration="0.5"
            shadow-intensity="1"
            environment-image="neutral"
            background-color="transparent"
            interaction-prompt="none">
          </model-viewer>
        </div>
      </div>
      
      <!-- Box 3 -->
      <div class="box">
        <div class="title">Health Technologies</div>
        <div class="subtitle-container">
          <div class="subtitle">•Exoskeleton</div>
          <div class="subtitle"></div>
        </div>
        <div class="model-container">
          <model-viewer
            src="model3.glb"
            camera-controls
            auto-rotate
            rotation-per-second="30deg"
            auto-play
            animation-name="idle"
            animation-crossfade-duration="0.5"
            shadow-intensity="1"
            environment-image="neutral"
            background-color="transparent"
            interaction-prompt="none">
          </model-viewer>
        </div>
      </div>
    </div>
    
    <div class="navigation">
      <div class="nav-dot active" data-index="0"></div>
      <div class="nav-dot" data-index="1"></div>
      <div class="nav-dot" data-index="2"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.container');
      const boxContainer = document.querySelector('.box-container');
      const dots = document.querySelectorAll('.nav-dot');
      const modelViewers = document.querySelectorAll('model-viewer');
      let currentIndex = 0;
      
      // Function to update display
      const updateDisplay = (index) => {
        boxContainer.style.transform = `translateX(${-index * 800}px)`;
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });
        currentIndex = index;
      };
      
      // Handle box click to advance to next box
      const boxes = document.querySelectorAll('.box');
      boxes.forEach(box => {
        box.addEventListener('click', (event) => {
          // Ignore clicks on navigation dots
          if (event.target.classList.contains('nav-dot')) return;
          
          // Move to next box or loop back to first
          const nextIndex = (currentIndex + 1) % 3;
          updateDisplay(nextIndex);
        });
      });
      
      // Handle navigation dot clicks
      dots.forEach(dot => {
        dot.addEventListener('click', (event) => {
          event.stopPropagation(); // Prevent container click from firing
          const index = parseInt(dot.getAttribute('data-index'));
          updateDisplay(index);
        });
      });
      
      // Set up animation for each model-viewer
      modelViewers.forEach(modelViewer => {
        modelViewer.addEventListener('load', () => {
          if (modelViewer.availableAnimations && modelViewer.availableAnimations.length > 0) {
            modelViewer.play({
              animation: 'idle',
              pingpong: true
            });
          }
        });
      });
    });
  </script>
</body>
</html>
